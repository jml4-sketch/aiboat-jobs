{"name":"aiboat-piracy","on":{"schedule":[{"cron":"17 6 * * *"}],"workflow_dispatch":{}},"jobs":{"push":{"runs-on":"ubuntu-latest","steps":[{"name":"Fetch IMB incident map","run":"curl -fsS --retry 3 --retry-delay 10 --max-time 90 -H 'Accept: application/json' -A 'Mozilla/5.0 (compatible; AIBOAT/1.0; +https://aiboatapp.com/about/)' -o imb.json 'https://icc-ccs.org/wp-json/wpgmza/v1/markers' && test -s imb.json && wc -c imb.json"},{"name":"Hand it to AIBOAT","env":{"PIRACY_KEY":"${{ secrets.PIRACY_KEY }}"},"run":"curl -fsS --max-time 120 -X POST 'https://aiboatapp.com/api/piracy' -H 'Content-Type: application/json' -H \"X-Cron-Key: ${PIRACY_KEY}\" --data-binary @imb.json | tee result.json && grep -q '\"ok\":true' result.json"}]}}}

